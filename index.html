<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbf8ff">
  <title>Open Sime</title>
  <link rel="icon" href="/public/assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/public/manifest.json">
  <link rel="stylesheet" href="/public/style.css">
  <script type="module" src="/public/strings.js"></script>
  <script src="/public/app.js" defer></script>
</head>
<body>
  <div id="splash" class="splash" role="status" aria-label="Se încarcă">
    <span class="spinner spinner-lg" aria-hidden="true"></span>
  </div>

  <main id="auth-view" class="auth" hidden>
    <span class="auth-deco deco-a" data-cookie aria-hidden="true"></span>
    <span class="auth-deco deco-b" data-cookie aria-hidden="true"></span>
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-brand">
        <span class="brand-mark" data-cookie aria-hidden="true"></span>
        <span>Open Sime</span>
      </div>
      <div>
        <h1 id="auth-title" class="auth-title">Autentificare</h1>
        <p class="auth-lead">Folosește contul tău de pe agenda.sime.md.</p>
      </div>
      <form id="login-form" class="auth-form" novalidate>
        <div class="seg" role="radiogroup" aria-label="Tip de cont">
          <input type="radio" id="role-student" name="role" value="student" checked>
          <label class="seg-btn" for="role-student">Elev</label>
          <input type="radio" id="role-parent" name="role" value="parent">
          <label class="seg-btn" for="role-parent">Părinte</label>
        </div>
        <div class="field">
          <input class="field-input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder=" " maxlength="128" required>
          <label class="field-label" for="username">Nume de utilizator</label>
        </div>
        <div class="field">
          <input class="field-input" id="password" name="password" type="password" autocomplete="current-password" placeholder=" " maxlength="256" required>
          <label class="field-label" for="password">Parolă</label>
          <button id="toggle-password" class="icon-btn field-action" type="button" aria-label="Arată parola" aria-pressed="false" data-icon="visibility"></button>
        </div>
        <label class="remember-row" hidden><input id="remember-me" type="checkbox"> <span>Ține-mă minte</span></label>
        <div id="auth-message" class="banner" role="alert" hidden>
          <span id="auth-message-icon" class="banner-icon"></span>
          <p id="auth-message-text"></p>
        </div>
        <button id="login-submit" class="btn btn-filled" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="login-label">Intră în cont</span>
        </button>
      </form>
    </section>
  </main>

  <div id="shell" class="shell" hidden>
    <aside class="rail" aria-label="Navigare principală">
      <div class="rail-brand">
        <span class="brand-mark" data-cookie aria-hidden="true"></span>
        <span class="brand-name">open-sime</span>
      </div>
      <nav id="rail-nav" class="rail-nav" aria-label="Secțiuni"></nav>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title" class="page-title">Acasă</h1>
          <p id="sync-status" class="sync-status sync-warn" role="status">
            <span class="sync-dot" aria-hidden="true"></span>
            <span id="sync-text">Nesincronizat</span>
          </p>
        </div>
        <div class="topbar-actions">
          <button id="profile-btn" class="icon-btn tonal profile-btn" type="button" aria-label="Profil și profesori" title="Profil și profesori" data-icon="person"></button>
          <button id="sync-btn" class="icon-btn tonal" type="button" aria-label="Sincronizează acum" data-icon="sync">
            <span id="sync-count" class="cooldown-count" aria-hidden="true"></span>
          </button>
          <button id="theme-btn" class="icon-btn" type="button"></button>
          <button id="settings-btn" class="icon-btn" type="button" aria-label="Setări" title="Setări" data-icon="settings"></button>
          <button id="logout-btn" class="icon-btn" type="button" aria-label="Deconectare" title="Deconectare" data-icon="logout"></button>
        </div>
      </header>

      <div class="student-strip">
        <div id="student-list" class="student-list" role="group" aria-label="Elev"></div>
      </div>

      <main id="content" class="content" tabindex="-1">
        <section class="view" id="view-home" data-view="home" aria-label="Acasă" hidden>
          <div class="home-grid">
            <section id="home-live" class="card live-card" aria-label="Orele de azi"></section>
            <div id="home-metrics" class="metrics"></div>
            <section id="home-marks" class="card marks-card" aria-label="Note recente"></section>
            <section id="home-homework" class="card homework-card" aria-label="Teme și termene"></section>
          </div>
        </section>

        <section class="view" id="view-marks" data-view="marks" aria-label="Reușita" hidden>
          <div id="marks-summary" class="stat-row"></div>
          <div id="marks-list" class="marks-table-wrap"></div>
        </section>

        <section class="view" id="view-timetable" data-view="timetable" aria-label="Orar" hidden>
          <div id="day-switch" class="day-switch"></div>
          <div id="day-heading" class="day-heading"></div>
          <div id="lesson-list"></div>
        </section>

        <section class="view" id="view-absences" data-view="absences" aria-label="Absențe" hidden>
          <div id="abs-toggle" class="seg abs-toggle" role="group" aria-label="Semestru"></div>
          <div id="abs-stats" class="stat-row"></div>
          <div id="abs-list"></div>
        </section>

        <section class="view" id="view-homework" data-view="homework" aria-label="Teme" hidden>
          <div id="homework-list"></div>
        </section>

        <section class="view" id="view-profile" data-view="profile" aria-label="Profil și profesori" hidden>
          <div id="profile-card"></div>
          <div id="teacher-grid"></div>
        </section>
      </main>
    </div>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Navigare"></nav>
  </div>

  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-dialog-title">
    <div class="settings-dialog-header">
      <h2 id="settings-dialog-title" class="settings-dialog-title">Setări</h2>
      <button id="settings-close-btn" class="icon-btn" type="button" aria-label="Închide" data-icon="close"></button>
    </div>
    <div class="settings-dialog-body">
      <section class="settings-section">
        <h3 class="settings-section-title">Limbă</h3>
        <div class="seg" role="radiogroup" aria-label="Limbă">
          <label><input type="radio" name="setting-lang" value="ro" checked><span class="seg-btn">Română</span></label>
          <label><input type="radio" name="setting-lang" value="ru"><span class="seg-btn">Русский</span></label>
          <label><input type="radio" name="setting-lang" value="en"><span class="seg-btn">English</span></label>
        </div>
      </section>

      <section class="settings-section">
        <h3 class="settings-section-title">Mărime text</h3>
        <div class="seg" role="radiogroup" aria-label="Mărime text">
          <label><input type="radio" name="setting-text-size" value="S"><span class="seg-btn">Mică (S)</span></label>
          <label><input type="radio" name="setting-text-size" value="M" checked><span class="seg-btn">Normală (M)</span></label>
          <label><input type="radio" name="setting-text-size" value="L"><span class="seg-btn">Mare (L)</span></label>
          <label><input type="radio" name="setting-text-size" value="XL"><span class="seg-btn">Foarte mare (XL)</span></label>
        </div>
      </section>

      <section class="settings-section">
        <h3 class="settings-section-title">Temă</h3>
        <div class="seg" role="radiogroup" aria-label="Temă">
          <label><input type="radio" name="setting-theme" value="system" checked><span class="seg-btn">Automat</span></label>
          <label><input type="radio" name="setting-theme" value="light"><span class="seg-btn">Luminoasă</span></label>
          <label><input type="radio" name="setting-theme" value="dark"><span class="seg-btn">Întunecată</span></label>
        </div>
      </section>

      <section class="settings-section">
        <h3 class="settings-section-title">Opțiuni accesibilitate</h3>
        <label class="setting-toggle-row">
          <input id="setting-simple-mode" type="checkbox">
          <div>
            <strong>Mod simplificat</strong>
            <p>Limbaj simplu și butoane mari pentru cei mici</p>
          </div>
        </label>
        <label class="setting-toggle-row">
          <input id="setting-contrast" type="checkbox">
          <div>
            <strong>Contrast sporit</strong>
            <p>Borduri accentuate și contrast ridicat</p>
          </div>
        </label>
        <label class="setting-toggle-row">
          <input id="setting-reduce-motion" type="checkbox">
          <div>
            <strong>Reducere animații</strong>
            <p>Dezactivează animațiile și efectele de tranziție</p>
          </div>
        </label>
      </section>
    </div>
  </dialog>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>
</body>
</html>
