[package]
name = "open-sime-desktop"
version = "1.0.1"
description = "Open SIME desktop client for agenda.sime.md"
authors = ["Open SIME Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "open_sime_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# OS CSPRNG for the Remember Me key (already part of the dependency tree via tauri).
getrandom = "0.3"

# OS credential stores for the Remember Me encryption key (src/keystore.rs):
# Windows Credential Manager, macOS Keychain, Linux Secret Service (GNOME Keyring / KWallet).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"

