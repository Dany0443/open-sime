[package]
name = "open-sime-desktop"
version = "1.0.0"
description = "Open SIME desktop client for agenda.sime.md"
authors = ["Open SIME Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "open_sime_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
