name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Code Checks & Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Web checks
        working-directory: web
        run: npm run check

      - name: Web unit tests
        working-directory: web
        run: npm test

      - name: Desktop checks
        working-directory: desktop
        run: npm run check

      - name: Desktop unit tests
        working-directory: desktop
        run: npm test

  build-preview:
    name: Build Preview (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Node.js sidecar executable
        working-directory: desktop
        run: node scripts/build-sidecar.mjs --target ${{ matrix.target }}

      - name: Setup Linux bundling environment
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat << 'EOF' > "$RUNNER_TEMP/bin/patchelf"
#!/bin/bash
TARGET="${@: -1}"
if [[ "$TARGET" == *"open-sime-server"* ]]; then
  echo "[patchelf shim] Skipping patchelf for sidecar: $TARGET"
  exit 0
fi
REAL_PATCHELF=$(which -a patchelf | grep -v "$RUNNER_TEMP/bin/patchelf" | head -n 1)
exec "$REAL_PATCHELF" "$@"
EOF
          chmod +x "$RUNNER_TEMP/bin/patchelf"
          echo "$RUNNER_TEMP/bin" >> $GITHUB_PATH

      - name: Build Tauri application (unsigned preview)
        working-directory: desktop
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          CI: "true"
          NO_STRIP: "true"

      - name: Verify Linux sidecar binary in AppImage
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          APPIMAGE_FILE=$(find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -name "*.AppImage" | head -n 1)
          if [ -n "$APPIMAGE_FILE" ]; then
            chmod +x "$APPIMAGE_FILE"
            rm -rf /tmp/ci-appimage-verify
            "$APPIMAGE_FILE" --appimage-extract
            mv squashfs-root /tmp/ci-appimage-verify
            OUTPUT=$(/tmp/ci-appimage-verify/usr/bin/open-sime-server --port invalid 2>&1 || true)
            echo "$OUTPUT"
            echo "$OUTPUT" | grep -q "INVALID_PORT" || { echo "Sidecar in AppImage failed validation: $OUTPUT"; exit 1; }
            rm -rf /tmp/ci-appimage-verify
            echo "Successfully verified Linux sidecar binary integrity inside AppImage"
          fi

      - name: Upload preview installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
