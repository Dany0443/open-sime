name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    name: Web Checks & Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Web checks
        working-directory: web
        run: npm run check

      - name: Web unit tests
        working-directory: web
        run: npm test

  desktop-checks:
    name: Desktop Checks & Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Desktop checks
        working-directory: desktop
        run: npm run check

      - name: Desktop unit tests
        working-directory: desktop
        run: npm test

  rust-checks:
    name: Rust Syntax Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Rust changes
        id: filter
        run: |
          RUST_PATHS="desktop/src-tauri/ desktop/scripts/build-sidecar.mjs desktop/package.json .github/workflows/ci.yml"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "$BASE"...HEAD -- $RUST_PATHS || true)
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only "$BEFORE"...HEAD -- $RUST_PATHS || true)
            elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only HEAD~1...HEAD -- $RUST_PATHS || true)
            else
              CHANGED="initial"
            fi
          else
            CHANGED="manual"
          fi

          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No Rust or Tauri build files changed. Skipping cargo check."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Rust changes detected: $CHANGED"
          fi

      - name: Setup Rust toolchain
        if: steps.filter.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        if: steps.filter.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux WebKitGTK headers
        if: steps.filter.outputs.skip != 'true'
        run: |
          if ! pkg-config --exists webkit2gtk-4.1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
          else
            echo "WebKitGTK 4.1 development headers already present."
          fi

      - name: Cargo check
        if: steps.filter.outputs.skip != 'true'
        working-directory: desktop/src-tauri
        run: cargo check

  ci-status:
    name: CI Completed
    runs-on: ubuntu-22.04
    needs: [web-checks, desktop-checks, rust-checks]
    if: always()
    steps:
      - name: Verify all checks succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          if echo "$results" | grep -qE "failure|cancelled"; then
            echo "Error: One or more CI checks failed or were cancelled."
            exit 1
          fi
          echo "✓ All required CI checks completed successfully."
