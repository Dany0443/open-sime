name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (defaults to authoritative version from package.json)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Tag, Versions, Secrets & Tests
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version-info.outputs.version }}
      tag: ${{ steps.version-info.outputs.tag }}
      sign_windows: ${{ steps.check-secrets.outputs.sign_windows }}
      sign_macos: ${{ steps.check-secrets.outputs.sign_macos }}
      sign_linux: ${{ steps.check-secrets.outputs.sign_linux }}
      sign_checksums: ${{ steps.check-secrets.outputs.sign_checksums }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Determine and verify authoritative version
        id: version-info
        working-directory: desktop
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            node scripts/check-versions.mjs --expected "$INPUT_VER"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            node scripts/check-versions.mjs --tag "${{ github.ref_name }}"
          else
            node scripts/check-versions.mjs
          fi
          VER=$(node scripts/check-versions.mjs --print)
          echo "Authoritative version: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Validate release signing credentials
        id: check-secrets
        working-directory: desktop
        run: node scripts/check-release-secrets.mjs
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}

      - name: Web checks
        working-directory: web
        run: npm run check

      - name: Web unit tests
        working-directory: web
        run: npm test

      - name: Desktop checks
        working-directory: desktop
        run: npm run check

      - name: Desktop unit tests
        working-directory: desktop
        run: npm test

  build-windows:
    name: Build & Package Windows x64 (NSIS)
    needs: validate-release
    runs-on: windows-latest
    env:
      SIGN_WINDOWS: ${{ needs.validate-release.outputs.sign_windows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2.7.5
        with:
          workspaces: desktop/src-tauri

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Import Authenticode certificate
        if: env.SIGN_WINDOWS == 'true'
        id: import-cert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
              $certBytes,
              $env:WINDOWS_CERTIFICATE_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable -bor [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet
          )
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store(
              [System.Security.Cryptography.X509Certificates.StoreName]::My,
              [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
          )
          $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $store.Add($cert)
          $store.Close()
          Write-Output "THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Write-Host "Authenticode certificate imported. Subject: $($cert.Subject), Thumbprint: $($cert.Thumbprint)"

      - name: Build Node.js sidecar executable
        working-directory: desktop
        run: node scripts/build-sidecar.mjs --target x86_64-pc-windows-msvc

      - name: Sign sidecar executable
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        working-directory: desktop
        run: |
          $sidecar = "src-tauri/binaries/open-sime-server-x86_64-pc-windows-msvc.exe"
          $cert = Get-Item "Cert:\CurrentUser\My\$env:THUMBPRINT"
          Set-AuthenticodeSignature -FilePath $sidecar -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
          $sig = Get-AuthenticodeSignature -FilePath $sidecar
          if ($sig.Status -ne "Valid") {
              Write-Error "Sidecar signing failed with status: $($sig.Status)"
              exit 1
          }
          Write-Host "Sidecar Authenticode signature valid."

      - name: Build signed Tauri NSIS package
        if: env.SIGN_WINDOWS == 'true'
        working-directory: desktop
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config "{\`"bundle\`":{\`"windows\`":{\`"certificateThumbprint\`":\`"$env:THUMBPRINT\`"}}}"

      - name: Build unsigned Tauri NSIS package
        if: env.SIGN_WINDOWS != 'true'
        working-directory: desktop
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Stage and verify NSIS installer
        shell: pwsh
        working-directory: desktop
        run: |
          node scripts/stage-release-artifact.mjs --target x86_64-pc-windows-msvc
          $artifact = node scripts/stage-release-artifact.mjs --name-only --platform windows

          if ($env:SIGN_WINDOWS -eq "true") {
              $sig = Get-AuthenticodeSignature -FilePath "./$artifact"
              Write-Host "Installer signature status: $($sig.Status), Signer: $($sig.SignerCertificate.Subject)"
              if ($sig.Status -ne "Valid") {
                  Write-Error "Installer signature verification failed: $($sig.StatusMessage)"
                  exit 1
              }
              Write-Host "Verified Windows installer Authenticode signature."
          } else {
              Write-Host "Built unsigned Windows installer $artifact"
          }

      - name: Cleanup certificate from store
        if: always() && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          if ($env:THUMBPRINT) {
              $store = New-Object System.Security.Cryptography.X509Certificates.X509Store(
                  [System.Security.Cryptography.X509Certificates.StoreName]::My,
                  [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
              )
              $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $targetCert = $store.Certificates | Where-Object { $_.Thumbprint -eq $env:THUMBPRINT }
              if ($targetCert) {
                  $store.Remove($targetCert)
                  Write-Host "Certificate $env:THUMBPRINT removed from CurrentUser\My"
              }
              $store.Close()
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: release-windows
          path: desktop/Open-SIME-installer-*.exe
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build & Package macOS (DMG)
    needs: validate-release
    runs-on: macos-latest
    env:
      SIGN_MACOS: ${{ needs.validate-release.outputs.sign_macos }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust build cache
        uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2.7.5
        with:
          workspaces: desktop/src-tauri

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Setup temporary macOS signing keychain
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Setup App Store Connect API Key for notarization
        if: env.SIGN_MACOS == 'true' && env.APPLE_API_KEY_BASE64 != '' && env.APPLE_API_KEY != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> $GITHUB_ENV

      - name: Build Node.js sidecar executable
        working-directory: desktop
        run: node scripts/build-sidecar.mjs --target aarch64-apple-darwin

      - name: Sign sidecar executable
        if: env.SIGN_MACOS == 'true'
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "src-tauri/binaries/open-sime-server-aarch64-apple-darwin"

      - name: Build signed and notarized DMG
        if: env.SIGN_MACOS == 'true'
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: npx tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Build unsigned DMG
        if: env.SIGN_MACOS != 'true'
        working-directory: desktop
        run: npx tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Rename and verify DMG
        working-directory: desktop
        run: |
          node scripts/stage-release-artifact.mjs --target aarch64-apple-darwin
          MAC_ARTIFACT=$(node scripts/stage-release-artifact.mjs --name-only --platform macos)

          if [ "$SIGN_MACOS" = "true" ]; then
            xcrun stapler staple "./$MAC_ARTIFACT" || true
            codesign --verify --deep --strict --verbose=2 "./$MAC_ARTIFACT"
            spctl --assess --type open --context context:primary-signature --verbose=2 "./$MAC_ARTIFACT"
            xcrun stapler validate "./$MAC_ARTIFACT"
            echo "Verified macOS code signature and notarization for $MAC_ARTIFACT"
          else
            echo "Staged unsigned macOS DMG: $MAC_ARTIFACT"
          fi

      - name: Cleanup temporary credentials
        if: always() && env.SIGN_MACOS == 'true'
        run: |
          rm -rf ~/.appstoreconnect/private_keys
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: release-macos
          path: desktop/Open-SIME-v*.dmg
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build & Package Linux x64 (AppImage)
    needs: validate-release
    runs-on: ubuntu-22.04
    env:
      SIGN_LINUX: ${{ needs.validate-release.outputs.sign_linux }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust build cache
        uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2.7.5
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux build dependencies & FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            patchelf \
            libfuse2

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Import GPG private key
        if: env.SIGN_LINUX == 'true'
        env:
          GPG_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY || secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import

      - name: Build signed Linux AppImage
        if: env.SIGN_LINUX == 'true'
        working-directory: desktop
        env:
          SIGN: "1"
          APPIMAGETOOL_FORCE_SIGN: "1"
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE || secrets.RELEASE_GPG_PASSPHRASE }}
        run: npx tauri build --target x86_64-unknown-linux-gnu --bundles appimage

      - name: Build unsigned Linux AppImage
        if: env.SIGN_LINUX != 'true'
        working-directory: desktop
        run: npx tauri build --target x86_64-unknown-linux-gnu --bundles appimage

      - name: Rename and verify Linux artifacts
        working-directory: desktop
        run: |
          node scripts/stage-release-artifact.mjs --target x86_64-unknown-linux-gnu
          node scripts/verify-appimage.mjs
          LNX_ARTIFACT=$(node scripts/stage-release-artifact.mjs --name-only --platform linux)

          if [ "$SIGN_LINUX" = "true" ]; then
            "./$LNX_ARTIFACT" --appimage-signature
            echo "Verified embedded AppImage signature."
          else
            echo "Staged unsigned Linux AppImage: $LNX_ARTIFACT."
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: release-linux
          path: desktop/Open-SIME-v*.AppImage
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Aggregate Artifacts, Sign Checksums & Publish Release
    needs: [validate-release, build-windows, build-macos, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create release assets directory
        run: mkdir -p release-assets

      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Verify all required release files are present
        run: |
          WIN_FILE=$(node desktop/scripts/stage-release-artifact.mjs --name-only --platform windows)
          MAC_FILE=$(node desktop/scripts/stage-release-artifact.mjs --name-only --platform macos)
          LNX_FILE=$(node desktop/scripts/stage-release-artifact.mjs --name-only --platform linux)

          REQUIRED_FILES=(
            "$WIN_FILE"
            "$MAC_FILE"
            "$LNX_FILE"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "release-assets/$file" ]; then
              echo "Error: Missing required release file: $file"
              exit 1
            fi
            echo "✓ Found: $file ($(wc -c < "release-assets/$file") bytes)"
          done

      - name: Generate SHA-256 checksums manifest
        working-directory: release-assets
        run: |
          sha256sum Open-SIME-* > checksums.txt
          echo "=== SHA-256 Checksums ==="
          cat checksums.txt

      - name: Create detached GPG signature for checksums
        if: needs.validate-release.outputs.sign_checksums == 'true'
        working-directory: release-assets
        env:
          GPG_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY || secrets.LINUX_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE || secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --detach-sign --armor --output checksums.txt.sig checksums.txt
          gpg --verify checksums.txt.sig checksums.txt
          echo "✓ Detached GPG signature created and verified."

      - name: Generate release notes and create or update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          TARGET_TAG: ${{ needs.validate-release.outputs.tag }}
          SIGN_WIN: ${{ needs.validate-release.outputs.sign_windows }}
          SIGN_MAC: ${{ needs.validate-release.outputs.sign_macos }}
          SIGN_LNX: ${{ needs.validate-release.outputs.sign_linux }}
          SIGN_SIG: ${{ needs.validate-release.outputs.sign_checksums }}
        run: |
          # 1. Determine previous published release tag
          PREV_TAG=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "${TARGET_TAG}^" 2>/dev/null || git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || echo "")
          fi
          echo "Previous release tag: ${PREV_TAG:-none}"

          # 2. Generate release notes
          NOTES_ARGS=(
            "--version" "$VERSION"
            "--output" "release-notes.md"
            "--sign-windows" "$SIGN_WIN"
            "--sign-macos" "$SIGN_MAC"
            "--sign-linux" "$SIGN_LNX"
            "--sign-checksums" "$SIGN_SIG"
          )
          if [ -n "$PREV_TAG" ]; then
            NOTES_ARGS+=("--prev-tag" "$PREV_TAG")
          fi
          node desktop/scripts/generate-release-notes.mjs "${NOTES_ARGS[@]}"

          echo "=== Release Notes ==="
          cat release-notes.md

          # 3. Assemble release assets
          WIN_FILE=$(node desktop/scripts/stage-release-artifact.mjs --name-only --platform windows)
          MAC_FILE=$(node desktop/scripts/stage-release-artifact.mjs --name-only --platform macos)
          LNX_FILE=$(node desktop/scripts/stage-release-artifact.mjs --name-only --platform linux)

          RELEASE_ASSETS=(
            "release-assets/$WIN_FILE"
            "release-assets/$MAC_FILE"
            "release-assets/$LNX_FILE"
            "release-assets/checksums.txt"
          )
          if [ -f "release-assets/checksums.txt.sig" ]; then
            RELEASE_ASSETS+=("release-assets/checksums.txt.sig")
          fi

          # 4. Create or update draft release (never publish automatically, avoid duplicates on retry)
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Draft release $TARGET_TAG already exists; updating notes and assets..."
            gh release edit "$TARGET_TAG" \
              --title "Open SIME $TARGET_TAG" \
              --notes-file release-notes.md \
              --draft=true
            gh release upload "$TARGET_TAG" "${RELEASE_ASSETS[@]}" --clobber
          else
            echo "Creating draft release $TARGET_TAG..."
            gh release create "$TARGET_TAG" \
              "${RELEASE_ASSETS[@]}" \
              --title "Open SIME $TARGET_TAG" \
              --notes-file release-notes.md \
              --draft=true \
              --prerelease=false
          fi

          echo "✓ Draft release $TARGET_TAG created/updated successfully (not published)."
