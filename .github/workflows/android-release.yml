name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Shared GitHub Release tag (e.g. v1.0.0, defaults to v<desktop_version>)"
        required: false
        default: ""
      version:
        description: "Legacy alias for release_tag"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-release:
    name: Build & Sign Android Release (APK & AAB)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch git tags
        run: git fetch --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine and verify authoritative version
        id: version-info
        working-directory: desktop
        run: |
          node scripts/check-versions.mjs
          DESKTOP_VER=$(node scripts/check-versions.mjs --print)
          echo "Authoritative web/desktop version: $DESKTOP_VER"
          echo "desktop_version=$DESKTOP_VER" >> "$GITHUB_OUTPUT"

          # Read independent Android app versionName and versionCode
          ANDROID_VER=$(grep -o 'versionName = "[^"]*"' ../android/app/build.gradle.kts | cut -d '"' -f 2)
          ANDROID_CODE=$(grep -o 'versionCode = [0-9]*' ../android/app/build.gradle.kts | awk '{print $3}')
          if [ -z "$ANDROID_VER" ] || [ -z "$ANDROID_CODE" ]; then
            echo "::error::Failed to read versionName or versionCode from android/app/build.gradle.kts"
            exit 1
          fi
          echo "Android application version: $ANDROID_VER (versionCode: $ANDROID_CODE)"
          echo "android_version=$ANDROID_VER" >> "$GITHUB_OUTPUT"
          echo "android_code=$ANDROID_CODE" >> "$GITHUB_OUTPUT"
          echo "version=$ANDROID_VER" >> "$GITHUB_OUTPUT"

          # Determine shared release tag (explicit input or default to v<desktop_version>)
          INPUT_TAG="${{ github.event.inputs.release_tag || github.event.inputs.version }}"
          if [ -n "$INPUT_TAG" ]; then
            TARGET_TAG=$([[ "$INPUT_TAG" =~ ^v ]] && echo "$INPUT_TAG" || echo "v$INPUT_TAG")
          else
            TARGET_TAG="v$DESKTOP_VER"
          fi
          echo "Target release tag: $TARGET_TAG"
          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

          # Prevent tag collision if Git tag already exists on a different commit
          TAG_COMMIT=$(git rev-parse -q --verify "refs/tags/${TARGET_TAG}^{commit}" 2>/dev/null || echo "")
          if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" != "${{ github.sha }}" ]; then
            echo "::error::Git tag ${TARGET_TAG} already exists on commit ${TAG_COMMIT}, but this workflow is running on commit ${{ github.sha }}."
            echo "::error::Cannot retarget an existing Git tag. Run from commit ${TAG_COMMIT} or specify a different release_tag."
            exit 1
          fi

      - name: Validate release secrets
        id: check-secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIME_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.SIME_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.SIME_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.SIME_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "::error::Android release signing secrets are incomplete or missing. Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "Android signing credentials validated successfully."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests & lint before release packaging
        working-directory: android
        run: |
          ./gradlew testDebugUnitTest
          ./gradlew lintDebug

      - name: Prepare keystore and build release artifacts
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIME_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.SIME_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.SIME_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.SIME_ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_DIR=$(mktemp -d "${RUNNER_TEMP}/android-signing-XXXXXX")
          KEYSTORE_FILE="${KEYSTORE_DIR}/release.jks"

          # Write keystore with restrictive permissions
          (umask 077 && echo "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_FILE}")
          chmod 600 "${KEYSTORE_FILE}"

          # Export path for Gradle
          export ANDROID_KEYSTORE_PATH="${KEYSTORE_FILE}"

          # Build signed release APK and AAB
          ./gradlew assembleRelease bundleRelease

          # Securely wipe keystore immediately after build
          shred -u "${KEYSTORE_FILE}" 2>/dev/null || rm -f "${KEYSTORE_FILE}"
          rm -rf "${KEYSTORE_DIR}"

      - name: Stage release artifacts & compute checksums
        env:
          ANDROID_VER: ${{ steps.version-info.outputs.android_version }}
        run: |
          mkdir -p release-dist/android
          APK_NAME="Open-Sime-Android-v${ANDROID_VER}.apk"
          AAB_NAME="Open-SIME-v${ANDROID_VER}.aab"

          cp "android/app/build/outputs/apk/release/${APK_NAME}" "release-dist/android/${APK_NAME}"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-dist/android/${AAB_NAME}"

          cd release-dist/android
          sha256sum "${APK_NAME}" "${AAB_NAME}" > checksums-android.txt
          cat checksums-android.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-sime-android-release
          path: release-dist/android/*
          if-no-files-found: error

      - name: Create or update GitHub draft release
        id: create-draft-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TARGET_TAG: ${{ steps.version-info.outputs.tag }}
          ANDROID_VER: ${{ steps.version-info.outputs.android_version }}
          DESKTOP_VER: ${{ steps.version-info.outputs.desktop_version }}
        run: |
          set -euo pipefail

          APK_FILE="release-dist/android/Open-Sime-Android-v${ANDROID_VER}.apk"
          AAB_FILE="release-dist/android/Open-SIME-v${ANDROID_VER}.aab"
          SUMS_FILE="release-dist/android/checksums-android.txt"

          # 1. Verify that all 3 required release assets exist and are non-empty
          for f in "$APK_FILE" "$AAB_FILE" "$SUMS_FILE"; do
            if [ ! -f "$f" ]; then
              echo "::error::Required release asset not found: $f"
              exit 1
            fi
            if [ ! -s "$f" ]; then
              echo "::error::Release asset is empty: $f"
              exit 1
            fi
          done

          RELEASE_ASSETS=(
            "$APK_FILE"
            "$AAB_FILE"
            "$SUMS_FILE"
          )

          # 2. Check existing Git tag: prevent tag hijacking or commit mismatch
          TAG_COMMIT=$(git rev-parse -q --verify "refs/tags/${TARGET_TAG}^{commit}" 2>/dev/null || echo "")
          if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Git tag ${TARGET_TAG} already exists on commit ${TAG_COMMIT}, but current build commit is ${GITHUB_SHA}."
            exit 1
          fi

          # 3. Check existing GitHub Release status
          EXISTING_IS_DRAFT=$(gh release view "$TARGET_TAG" --json isDraft -q .isDraft 2>/dev/null || echo "")

          if [ -n "$EXISTING_IS_DRAFT" ]; then
            # Release already exists on GitHub
            if [ "$EXISTING_IS_DRAFT" != "true" ]; then
              echo "::error::Release ${TARGET_TAG} is already published on GitHub. Overwriting or attaching assets to a published release is strictly forbidden."
              exit 1
            fi

            # Draft release exists. If target commit differs, warn but preserve draft target commit
            EXISTING_TARGET=$(gh release view "$TARGET_TAG" --json targetCommitish -q .targetCommitish 2>/dev/null || echo "")
            if [ -n "$EXISTING_TARGET" ] && [ "${#EXISTING_TARGET}" -eq 40 ] && [ "$EXISTING_TARGET" != "$GITHUB_SHA" ]; then
              echo "::warning::Draft release ${TARGET_TAG} was initialized targeting commit ${EXISTING_TARGET}, while current run is on commit ${GITHUB_SHA}. Target commit is preserved."
            fi

            echo "Existing draft release ${TARGET_TAG} found. Uploading Android release assets while preserving draft state and notes..."
            gh release edit "$TARGET_TAG" --draft=true
            gh release upload "$TARGET_TAG" "${RELEASE_ASSETS[@]}" --clobber
            echo "✓ Android assets uploaded to draft release ${TARGET_TAG}."
          else
            # Release does not exist yet. Create a new draft release.
            echo "Creating new draft release ${TARGET_TAG} targeting commit ${GITHUB_SHA}..."
            gh release create "$TARGET_TAG" \
              "${RELEASE_ASSETS[@]}" \
              --title "Open SIME ${TARGET_TAG}" \
              --notes "Open SIME ${TARGET_TAG} (Android v${ANDROID_VER}, Web/Desktop v${DESKTOP_VER})." \
              --draft=true \
              --prerelease=false \
              --target "$GITHUB_SHA"
            echo "✓ Draft release ${TARGET_TAG} created."
          fi

          # 4. Resolve draft release URL for workflow summary
          RELEASE_URL=$(gh release view "$TARGET_TAG" --json url -q .url 2>/dev/null || echo "")
          if [ -z "$RELEASE_URL" ]; then
            RELEASE_URL="https://github.com/${REPOSITORY}/releases/tag/${TARGET_TAG}"
          fi
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Generate release workflow summary
        if: success()
        env:
          TARGET_TAG: ${{ steps.version-info.outputs.tag }}
          ANDROID_VER: ${{ steps.version-info.outputs.android_version }}
          ANDROID_CODE: ${{ steps.version-info.outputs.android_code }}
          DESKTOP_VER: ${{ steps.version-info.outputs.desktop_version }}
          RELEASE_URL: ${{ steps.create-draft-release.outputs.release_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          APK_FILE="release-dist/android/Open-Sime-Android-v${ANDROID_VER}.apk"
          AAB_FILE="release-dist/android/Open-SIME-v${ANDROID_VER}.aab"
          SUMS_FILE="release-dist/android/checksums-android.txt"

          APK_SIZE=$(wc -c < "$APK_FILE" | tr -d ' ')
          AAB_SIZE=$(wc -c < "$AAB_FILE" | tr -d ' ')
          SUMS_SIZE=$(wc -c < "$SUMS_FILE" | tr -d ' ')
          CHECKSUMS=$(cat "$SUMS_FILE")

          {
            echo "## Open SIME Android Release (Draft)"
            echo ""
            echo "> [!IMPORTANT]"
            echo "> **Status: Draft Release Prepared (NOT published)**"
            echo ">"
            echo "> This release is saved as a **draft** on GitHub. It has **NOT** been published to users."
            echo "> You can review the draft release, verify the assets, and publish manually when ready."
            echo ""
            echo "| Property | Value |"
            echo "| :--- | :--- |"
            echo "| **Android Version** | \`v${ANDROID_VER}\` (versionCode \`${ANDROID_CODE}\`) |"
            echo "| **Desktop / Web Version** | \`v${DESKTOP_VER}\` |"
            echo "| **Release Tag** | \`${TARGET_TAG}\` |"
            echo "| **Commit** | \`${COMMIT_SHA}\` |"
            echo "| **Draft Release URL** | [View Draft Release on GitHub](${RELEASE_URL}) |"
            echo ""
            echo "### Attached Release Assets"
            echo "- **\`Open-Sime-Android-v${ANDROID_VER}.apk\`** — ${APK_SIZE} bytes (direct sideload package)"
            echo "- **\`Open-SIME-v${ANDROID_VER}.aab\`** — ${AAB_SIZE} bytes (Android App Bundle)"
            echo "- **\`checksums-android.txt\`** — ${SUMS_SIZE} bytes (SHA-256 checksums)"
            echo ""
            echo "#### SHA-256 Checksums"
            echo "\`\`\`"
            echo "${CHECKSUMS}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

